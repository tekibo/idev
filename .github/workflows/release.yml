name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the version
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep 'const Version =' internal/platform/manifest/manifest.go | cut -d'"' -f2)"
          test "$TAG" = "v$version" || {
            echo "tag $TAG does not match manifest.go v$version" >&2
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
      - name: Test and build
        run: |
          go test ./...
          scripts/build-release
      - name: Check the assets
        run: |
          test -f dist/manifest.json
          test -f dist/SHA256SUMS
          test -f dist/install.sh
          test -f dist/idev-linux-amd64.tar.gz
          test -f dist/idev-linux-arm64.tar.gz
          test -f dist/react-native-*.tar.gz
          test -f dist/apple-tools-*.tar.gz
          test -f dist/flutter-*.tar.gz
          test -f dist/kmp-*.tar.gz
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/idev-linux-amd64.tar.gz \
            dist/idev-linux-arm64.tar.gz \
            dist/react-native-*.tar.gz \
            dist/apple-tools-*.tar.gz \
            dist/flutter-*.tar.gz \
            dist/kmp-*.tar.gz \
            dist/xtool-source-*.tar.gz \
            dist/swift-build-source-*.tar.gz \
            dist/manifest.json \
            dist/SHA256SUMS \
            dist/install.sh \
            --title "$TAG" --generate-notes
